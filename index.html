<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VICIdial Dialpad</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <div class="header">
                    <h2>📞 VICIdial Dialpad</h2>
                    <p>Login with your agent credentials</p>
                </div>

                <div id="loginStatus" class="status-message"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Agent Name</label>
                        <input type="text" id="agentName" class="form-input"
                               placeholder="e.g., John Smith" required>
                        <div class="form-hint">Your display name</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">VICIdial Username</label>
                        <input type="text" id="username" class="form-input"
                               placeholder="e.g., 6666" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label class="form-label">VICIdial Password</label>
                        <input type="password" id="password" class="form-input"
                               placeholder="Your password" required autocomplete="current-password">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Extension Number</label>
                        <input type="text" id="extension" class="form-input"
                               placeholder="e.g., 8600051" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">VICIdial Server</label>
                        <select id="serverUrl" class="form-input" required>
                            <option value="">-- Select Server --</option>
                            <option value="https://maingreendialer.projems.com">MAINGREEN</option>
                            <option value="https://vicidial.projems.com" selected>BLESSED</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        🔐 Login
                    </button>
                </form>
            </div>
        </div>

        <!-- Dialpad Screen -->
        <div id="dialpadScreen" class="screen">
            <div class="header">
                <h2>📞 Dialpad</h2>
                <div id="agentInfo" class="agent-info">
                    <span id="agentNameDisplay">Agent</span>
                </div>
                <div class="status-badge status-ready" id="statusBadge">Ready</div>
                <button class="btn-logout" onclick="logout()">🚪 Logout</button>
            </div>

            <div class="call-info" id="callInfo">
                <div class="call-info-row">
                    <span class="call-info-label">Number:</span>
                    <span class="call-info-value" id="callingNumber">-</span>
                </div>
                <div class="call-info-row">
                    <span class="call-info-label">Duration:</span>
                    <span class="call-info-value" id="callDuration">00:00</span>
                </div>
            </div>

            <div class="display">
                <input type="tel" class="display-number" id="displayNumber"
                       placeholder="Enter or paste number" autocomplete="tel">
            </div>
            <div class="keyboard-hint">💡 You can paste or type using your keyboard</div>

            <div class="button-grid">
                <button class="btn btn-clear" onclick="clearNumber()">⌫ Clear</button>
                <button class="btn btn-call" id="callBtn" onclick="makeCall()">📞 DIAL</button>
                <button class="btn btn-hangup" id="hangupBtn" onclick="hangupCall()" disabled>📵 HANGUP</button>
                <button class="btn btn-disposition" id="dispositionBtn" onclick="showDispositionModal()" disabled>📋 DISPOSITION</button>
                <button class="btn btn-pause" id="pauseBtn" onclick="pauseAgent()" disabled>⏸️ PAUSE</button>
            </div>

            <!-- Disposition Modal -->
            <div class="disposition-modal" id="dispositionModal">
                <div class="modal-content">
                    <div class="modal-header">Select Disposition</div>
                    <div class="disposition-list" id="dispositionList"></div>
                    <br>
                    <button class="btn btn-clear" onclick="closeDispositionModal()">Cancel</button>
                </div>
            </div>

            <!-- Notification -->
            <div class="notification" id="notification"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
